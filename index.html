<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revision tracker</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --ink: #14181f;
    --muted: #6b7484;
    --line: #e2e6ec;
    --empty: #e8ebf0;
    --shadow: 0 1px 2px rgba(20, 24, 31, .06), 0 8px 24px rgba(20, 24, 31, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --panel: #151b23;
      --ink: #e6edf3;
      --muted: #8b95a5;
      --line: #262d38;
      --empty: #1e242e;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 16px; font-weight: 600;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .scroll { overflow-x: auto; padding-bottom: 4px; }
  .heat { display: flex; gap: 10px; min-width: max-content; }
  .daylabels { display: grid; grid-template-rows: repeat(7, 15px); font-size: 10px; color: var(--muted); margin-top: 18px; }
  .daylabels span { line-height: 15px; }
  .grid-outer { display: flex; flex-direction: column; }
  .months { display: flex; height: 18px; font-size: 11px; color: var(--muted); position: relative; }
  .months span { position: absolute; white-space: nowrap; }
  .weeks { display: flex; gap: 3px; }
  .week { display: grid; grid-template-rows: repeat(7, 12px); gap: 3px; }
  .cell { width: 12px; height: 12px; border-radius: 2px; background: var(--empty); }
  .cell.has { cursor: pointer; }
  .cell.today { outline: 1.5px solid var(--ink); outline-offset: 1px; }

  .legend { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 11px; color: var(--muted); }
  .ramp { height: 10px; width: 200px; border-radius: 3px; }

  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 7px;
    font-size: 12px; line-height: 1.45; max-width: 260px; z-index: 10;
  }
  #tip b { font-weight: 650; }

  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 110px 1fr 62px; align-items: center; gap: 10px; font-size: 13px; }
  .bar .track { height: 8px; background: var(--empty); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 4px; }
  .bar .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .empty { color: var(--muted); font-size: 14px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Revision tracker</h1>
    <div class="sub" id="sub"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="panel">
    <h2>Every day, shaded by minutes</h2>
    <div class="scroll">
      <div class="heat">
        <div class="daylabels"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
        <div class="grid-outer">
          <div class="months" id="months"></div>
          <div class="weeks" id="weeks"></div>
        </div>
      </div>
    </div>
    <div class="legend">
      <span id="legmin">0</span>
      <div class="ramp" id="ramp"></div>
      <span id="legmax"></span>
    </div>
  </div>

  <div class="panel">
    <h2>Daily minutes and 7-day average</h2>
    <div id="trend"></div>
  </div>

  <div class="panel">
    <h2>Where the time went</h2>
    <div class="bars" id="subjects"></div>
  </div>

  <footer id="foot"></footer>
</div>

<div id="tip"></div>

<script>
const DATA = {"days":[],"subjects":[],"cap":180,"stats":{"totalMinutes":0,"sessions":0,"currentStreak":0,"longestStreak":0,"last7":0,"activeDays":0},"generated":"05 Aug 2026, 21:47"};

/* Blue -> cyan -> green -> yellow -> orange -> red -> dark red.
   A long ramp on purpose: an average day should land mid-scale so
   variation between ordinary days is still visible. */
const STOPS = [
  [0.00, [ 40,  90, 180]],
  [0.14, [  0, 150, 205]],
  [0.28, [  0, 190, 175]],
  [0.42, [110, 205, 110]],
  [0.56, [225, 225,  80]],
  [0.68, [248, 190,  55]],
  [0.79, [242, 140,  40]],
  [0.89, [228,  70,  40]],
  [0.96, [186,  25,  30]],
  [1.00, [116,  10,  22]],
];

function colour(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const [p0, c0] = STOPS[i - 1], [p1, c1] = STOPS[i];
      const k = (t - p0) / (p1 - p0);
      const c = c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return `rgb(${STOPS[STOPS.length - 1][1].join(",")})`;
}

/* Linear against the cap, so a typical day lands mid-ramp (green/yellow)
   and light vs heavy days are obvious at a glance. */
const ease = (mins, cap) => Math.min(1, mins / cap);

const fmt = m => { const h = Math.floor(m / 60), r = m % 60;
  return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const iso = d => d.toISOString().slice(0, 10);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const byDate = new Map(DATA.days.map(d => [d.date, d]));
const cap = DATA.cap;
const today = new Date(); today.setHours(12, 0, 0, 0);

/* ---- header + tiles ---- */
const s = DATA.stats;
document.getElementById("sub").textContent = s.sessions
  ? `${s.sessions} sessions logged · scale tops out at ${fmt(cap)} a day`
  : "Nothing logged yet — run: rev 90 Chemistry";

const tiles = [
  [fmt(s.totalMinutes), "total logged"],
  [fmt(s.last7), "last 7 days"],
  [`${s.currentStreak}d`, `current streak (best ${s.longestStreak}d)`],
  [s.activeDays, "days revised"],
  [s.activeDays ? fmt(Math.round(s.totalMinutes / s.activeDays)) : "0m", "average active day"],
];
document.getElementById("tiles").innerHTML = tiles
  .map(([v, k]) => `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");

/* ---- heatmap ---- */
let start;
if (DATA.days.length) {
  start = new Date(DATA.days[0].date + "T12:00:00");
  const year = new Date(today); year.setDate(year.getDate() - 364);
  if (start > year) start = year;          // always show at least a year
} else {
  start = new Date(today); start.setDate(start.getDate() - 364);
}
start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // back to Monday

const weeksEl = document.getElementById("weeks");
const monthsEl = document.getElementById("months");
const cursor = new Date(start);
let week = 0, lastMonth = -1;

while (cursor <= today) {
  const col = document.createElement("div");
  col.className = "week";
  for (let i = 0; i < 7; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    if (cursor <= today && cursor >= start) {
      const key = iso(cursor);
      const day = byDate.get(key);
      if (day) {
        cell.classList.add("has");
        cell.style.background = colour(ease(day.minutes, cap));
        cell.dataset.day = key;
      }
      if (key === iso(today)) cell.classList.add("today");
      if (cursor.getDate() <= 7 && cursor.getMonth() !== lastMonth) {
        lastMonth = cursor.getMonth();
        const label = document.createElement("span");
        label.textContent = MONTHS[lastMonth];
        label.style.left = (week * 15) + "px";
        monthsEl.appendChild(label);
      }
    }
    col.appendChild(cell);
    cursor.setDate(cursor.getDate() + 1);
  }
  weeksEl.appendChild(col);
  week++;
}

document.getElementById("ramp").style.background =
  `linear-gradient(to right, ${STOPS.map(([p]) => colour(p) + " " + (p * 100).toFixed(0) + "%").join(",")})`;
document.getElementById("legmax").textContent = fmt(cap) + "+";

/* ---- tooltip ---- */
const tip = document.getElementById("tip");
weeksEl.addEventListener("mouseover", e => {
  const key = e.target.dataset && e.target.dataset.day;
  if (!key) return;
  const day = byDate.get(key);
  const d = new Date(key + "T12:00:00");
  tip.innerHTML = `<b>${fmt(day.minutes)}</b> — ${d.toLocaleDateString("en-GB",
      { weekday: "short", day: "numeric", month: "short", year: "numeric" })}<br>`
    + day.sessions.map(x => `${x.label} · ${fmt(x.minutes)}`).join("<br>");
  const r = e.target.getBoundingClientRect();
  tip.style.opacity = 1;
  tip.style.left = Math.min(r.left, innerWidth - tip.offsetWidth - 12) + "px";
  tip.style.top = (r.top - tip.offsetHeight - 8) + "px";
});
weeksEl.addEventListener("mouseout", () => tip.style.opacity = 0);

/* ---- trend: daily bars + 7-day rolling average ---- */
(function trend() {
  const host = document.getElementById("trend");
  if (!DATA.days.length) { host.innerHTML = '<div class="empty">No sessions yet.</div>'; return; }

  const days = [];
  const from = new Date(today); from.setDate(from.getDate() - 89);
  const floor = new Date(today); floor.setDate(floor.getDate() - 29);
  const first = new Date(DATA.days[0].date + "T12:00:00");
  /* start at the first entry, but never show fewer than 30 days
     or more than 90 — otherwise early bars are absurdly wide */
  const c = new Date(Math.min(Math.max(+first, +from), +floor));
  while (c <= today) {
    const d = byDate.get(iso(c));
    days.push({ date: iso(c), minutes: d ? d.minutes : 0 });
    c.setDate(c.getDate() + 1);
  }
  const avg = days.map((_, i) => {
    const win = days.slice(Math.max(0, i - 6), i + 1);
    return win.reduce((a, b) => a + b.minutes, 0) / win.length;
  });

  const W = 940, H = 200, PAD = { l: 38, r: 8, t: 10, b: 22 };
  const top = Math.max(60, Math.ceil(Math.max(...days.map(d => d.minutes)) / 30) * 30);
  const x = i => PAD.l + (i * (W - PAD.l - PAD.r)) / Math.max(1, days.length);
  const bw = Math.max(1.5, (W - PAD.l - PAD.r) / days.length - 1.5);
  const y = v => H - PAD.b - (v / top) * (H - PAD.t - PAD.b);

  const grid = [0, 0.5, 1].map(f => `
    <line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y(top * f)}" y2="${y(top * f)}"
          stroke="var(--line)" stroke-width="1"/>
    <text x="${PAD.l - 6}" y="${y(top * f) + 3.5}" text-anchor="end"
          font-size="10" fill="var(--muted)">${Math.round(top * f)}</text>`).join("");

  const bars = days.map((d, i) => d.minutes
    ? `<rect x="${x(i)}" y="${y(d.minutes)}" width="${bw}" height="${H - PAD.b - y(d.minutes)}"
             rx="1.5" fill="${colour(ease(d.minutes, cap))}"><title>${d.date}: ${fmt(d.minutes)}</title></rect>`
    : "").join("");

  const line = avg.map((v, i) => `${x(i) + bw / 2},${y(v)}`).join(" ");
  const ticks = days.map((d, i) => (d.date.slice(8) === "01")
    ? `<text x="${x(i)}" y="${H - 6}" font-size="10" fill="var(--muted)">${MONTHS[+d.date.slice(5, 7) - 1]}</text>`
    : "").join("");

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
      aria-label="Daily revision minutes with a 7-day rolling average">
    ${grid}${bars}${ticks}
    <polyline points="${line}" fill="none" stroke="var(--ink)" stroke-width="1.75"
              stroke-linejoin="round" opacity=".75"/>
  </svg>
  <div class="sub" style="margin-top:6px">Last ${days.length} days · line is the 7-day average</div>`;
})();

/* ---- subjects ---- */
(function subjects() {
  const host = document.getElementById("subjects");
  if (!DATA.subjects.length) { host.innerHTML = '<div class="empty">No subjects yet.</div>'; return; }
  const max = DATA.subjects[0].minutes;
  host.innerHTML = DATA.subjects.map((sub, i) => {
    const share = DATA.subjects.length > 1 ? i / (DATA.subjects.length - 1) : 0;
    return `<div class="bar">
      <div>${sub.name}</div>
      <div class="track"><div class="fill" style="width:${(sub.minutes / max) * 100}%;
        background:${colour(1 - share * 0.85)}"></div></div>
      <div class="num">${fmt(sub.minutes)}</div>
    </div>`;
  }).join("");
})();

document.getElementById("foot").textContent = "Updated " + DATA.generated;
</script>
</body>
</html>
